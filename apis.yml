aid: dmedglobal
name: dMed Global (Caidya)
description: dMed Global, now operating as Caidya, is a global, full-service clinical
  research organization (CRO) headquartered in Shanghai, China and backed by Qiming
  Venture Partners. The company provides flexible, patient-centric clinical trial
  solutions to biopharmaceutical innovators, running studies across more than 40
  countries and regions. Its capabilities span clinical operations, regulatory
  services, data management, biostatistics, and complex trial execution across core
  therapeutic areas. Caidya operates an English-language corporate site at
  caidya.com and a Chinese-language site at caidya.cn. This profile is maintained in
  the API Evangelist network as a company record; the company publishes no public
  API or developer program at this time.
